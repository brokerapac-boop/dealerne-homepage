# 이 폴더가 그대로 사이트에 올라갑니다. 빌드 과정은 없습니다.
[build]
  publish = "."

# 예전 시안 주소와 끝에 / 가 붙은 아카데미 주소를 정리합니다.
[[redirects]]
  from = "/flow/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/academy/"
  to = "/academy"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
