# 이 폴더가 그대로 사이트에 올라갑니다. 빌드 과정은 없습니다.
[build]
  publish = "."

# 상담 신청이 접수되면 실행되는 기능(텔레그램 알림)이 들어 있는 폴더입니다.
[functions]
  directory = "netlify/functions"

# 위 폴더의 소스 파일이 사이트 주소로 열리지 않게 합니다.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# 예전 시안 주소와 끝에 / 가 붙은 아카데미 주소를 정리합니다.
[[redirects]]
  from = "/flow/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/academy/"
  to = "/academy"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
